name: Release

# Pushing a tag like v1.0.0 builds the app and publishes it as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
      - run: ./build.sh
      - name: Package as a disk image with a shortcut to Applications
        run: |
          mkdir dmg
          cp -R ACBar.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "AC Bar" -srcfolder dmg -ov -format UDZO ACBar.dmg
      - run: gh release create "$GITHUB_REF_NAME" ACBar.dmg --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
